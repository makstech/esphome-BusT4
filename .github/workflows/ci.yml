name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build & run host unit tests
        run: |
          g++ -std=c++17 -Wall \
            -I components/bus_t4_control_unit -I tests/stubs \
            components/bus_t4_control_unit/time_based_position_estimator.cpp \
            tests/test_time_based_position_estimator.cpp \
            -o estimator_test
          ./estimator_test

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check README tables in sync with schema
        run: python scripts/gen_param_docs.py --check

      - name: Install ESPHome
        run: pip install esphome

      - name: Create test secrets
        run: |
          cat > secrets.yaml << EOF
          wifi_ssid: "test_ssid"
          wifi_password: "test_password"
          EOF

      - name: Validate configuration
        run: esphome config example.yaml

  build:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install ESPHome
        run: pip install esphome

      - name: Create test secrets
        run: |
          cat > secrets.yaml << EOF
          wifi_ssid: "test_ssid"
          wifi_password: "test_password"
          EOF

      - name: Compile firmware
        run: esphome compile example.yaml
