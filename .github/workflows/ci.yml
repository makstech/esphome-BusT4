name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build and run packet parser tests
        run: |
          g++ -std=c++17 -Wall -Wextra tests/test_t4_packet.cpp -o t4test
          ./t4test

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install ESPHome
        run: pip install esphome

      - name: Create test secrets
        run: |
          cat > secrets.yaml << EOF
          wifi_ssid: "test_ssid"
          wifi_password: "test_password"
          EOF

      - name: Validate configuration
        run: esphome config example.yaml

      - name: Validate capture (debug) configuration
        run: esphome config debug_yaml

  build:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install ESPHome
        run: pip install esphome

      - name: Create test secrets
        run: |
          cat > secrets.yaml << EOF
          wifi_ssid: "test_ssid"
          wifi_password: "test_password"
          EOF

      - name: Compile firmware
        run: esphome compile example.yaml
