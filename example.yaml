# Nice Bus-T4 Example Configuration
# For use with Nice BiDi-WiFi module or custom ESP32 hardware

esphome:
  name: gate
  friendly_name: Gate

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      # BiDi-WiFi uses ESP32 rev3.1 - reduces binary size by excluding legacy silicon workarounds.
      # Safe to use with OTA: incompatible chips will reject the firmware and roll back automatically.
      # Remove or adjust for custom ESP32 hardware with a different chip revision.
      minimum_chip_revision: "3.1"

logger:
  baud_rate: 0  # Disable serial logging (UART is used for Bus-T4)

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Gate Fallback"
    password: "fallback123"

web_server:
  port: 80

external_components:
  - source: components

# UART configuration for Bus-T4
# BiDi-WiFi: GPIO21 (TX), GPIO18 (RX)
# Custom hardware: adjust pins as needed
uart:
  tx_pin: GPIO21
  rx_pin: GPIO18
  baud_rate: 19200

bus_t4:
  id: bus
  # Set true and watch the logs to capture unmapped BlueBus packets (photocells, keypad).
  # See the README "BlueBus events" section and debug_yaml.
  # debug_unknown_packets: true

cover:
  - platform: bus_t4
    name: "Gate"
    id: gate
    auto_learn_timing: true
    open_duration: 20s
    close_duration: 20s
    position_report_interval: 1s

# --- BlueBus events ---------------------------------------------------------
# Keypad / command events: fires every time the control unit reports an executed
# command on the bus (open / close / step_by_step / partial_1..3 / stop), whatever
# the source. The command is the payload; the source (keypad vs remote vs app)
# cannot be identified. See README.
event:
  - platform: bus_t4
    name: "Gate keypad"
    device_class: button

# Photocell beam state (EXPERIMENTAL). address = photocell index 1/2/3 (PHOTO/PHOTO2/PHOTO3).
# The 0xD0 decode is unverified — confirm against a capture before trusting it (see README).
binary_sensor:
  - platform: bus_t4
    address: 1
    name: "Photocell gate"
    device_class: safety

# Diagnostic: comma-separated list of Bus-T4 devices seen on the bus. Confirms the
# component is talking to the controller / receiver.
text_sensor:
  - platform: bus_t4
    name: "Bus devices"

# Optional: Additional buttons for partial opening
button:
  - platform: template
    name: "Partial Open 1"
    icon: "mdi:gate-arrow-right"
    on_press:
      - lambda: id(gate).send_cmd(CMD_OPEN_PARTIAL_1);

  - platform: template
    name: "Partial Open 2"
    icon: "mdi:gate-arrow-right"
    on_press:
      - lambda: id(gate).send_cmd(CMD_OPEN_PARTIAL_2);

  - platform: template
    name: "Step-by-Step"
    icon: "mdi:gate"
    on_press:
      - lambda: id(gate).send_cmd(CMD_STEP);

# Motor controller configuration switches
# These send SET commands to change the controller's settings
switch:
  - platform: template
    name: "Auto-Close"
    icon: "mdi:timer"
    optimistic: true
    turn_on_action:
      - lambda: id(gate).set_auto_close(true);
    turn_off_action:
      - lambda: id(gate).set_auto_close(false);

  - platform: template
    name: "Photo-Close"
    icon: "mdi:camera-timer"
    optimistic: true
    turn_on_action:
      - lambda: id(gate).set_photo_close(true);
    turn_off_action:
      - lambda: id(gate).set_photo_close(false);

  - platform: template
    name: "Always Close"
    icon: "mdi:lock"
    optimistic: true
    turn_on_action:
      - lambda: id(gate).set_always_close(true);
    turn_off_action:
      - lambda: id(gate).set_always_close(false);

  - platform: template
    name: "Standby Mode"
    icon: "mdi:power-standby"
    optimistic: true
    turn_on_action:
      - lambda: id(gate).set_standby(true);
    turn_off_action:
      - lambda: id(gate).set_standby(false);

  - platform: template
    name: "Peak Mode"
    icon: "mdi:speedometer"
    optimistic: true
    turn_on_action:
      - lambda: id(gate).set_peak_mode(true);
    turn_off_action:
      - lambda: id(gate).set_peak_mode(false);

  - platform: template
    name: "Pre-Flash Warning"
    icon: "mdi:alarm-light"
    optimistic: true
    turn_on_action:
      - lambda: id(gate).set_pre_flash(true);
    turn_off_action:
      - lambda: id(gate).set_pre_flash(false);

# Security lock using IT4WIFI device identity
lock:
  - platform: template
    name: "Gate Lock"
    optimistic: true
    on_lock:
      - lambda: 'id(gate).send_cmd(CMD_BLOCK, IT4WIFI);'
    on_unlock:
      - lambda: 'id(gate).send_cmd(CMD_RELEASE, IT4WIFI);'

# Raw hex command input for debugging/testing
# Enter hex string like "55.0C.00.FF..." or "550C00FF..." in Home Assistant
text:
  - platform: template
    name: "Raw Command"
    id: raw_command
    optimistic: true
    mode: text
    on_value:
      then:
        - lambda: |-
            if (!x.empty()) {
              id(gate).send_raw_cmd(x);
            }

