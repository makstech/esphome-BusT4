# Nice Bus-T4 Example Configuration
# For use with Nice BiDi-WiFi module or custom ESP32 hardware

esphome:
  name: gate
  friendly_name: Gate

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      # BiDi-WiFi uses ESP32 rev3.1 - reduces binary size by excluding legacy silicon workarounds.
      # Safe to use with OTA: incompatible chips will reject the firmware and roll back automatically.
      # Remove or adjust for custom ESP32 hardware with a different chip revision.
      minimum_chip_revision: "3.1"

logger:
  baud_rate: 0  # Disable serial logging (UART is used for Bus-T4)

api:
  # Interactive bus debugging — call at runtime from Home Assistant
  # (Developer Tools -> Actions) or `esphome` scripts, no reflash needed.
  # Watch replies with: esphome logs example.yaml
  actions:
    # Send only the DMP message bytes; header, 55/size framing and both CRCs are
    # added for you. Returns {"reply": "<hex>"} to the caller.
    # Example (get control-unit IO state): message="04 D1 99 00 00"
    - action: debug_request
      variables:
        message: string
      then:
        - api.respond:
            data: !lambda 'root["reply"] = id(bus)->debug_request(message);'
    # Send a byte-exact frame (you supply the whole frame incl. framing + CRCs).
    # Returns {"reply": "<hex>"} to the caller (HA: call with "return response").
    - action: debug_request_raw
      variables:
        frame: string
      then:
        - api.respond:
            data: !lambda 'root["reply"] = id(bus)->debug_request_raw(frame);'

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Gate Fallback"
    password: "fallback123"

web_server:
  port: 80

external_components:
  - source: components

# UART configuration for Bus-T4
# BiDi-WiFi: GPIO21 (TX), GPIO18 (RX)
# Custom hardware: adjust pins as needed
uart:
  tx_pin: GPIO21
  rx_pin: GPIO18
  baud_rate: 19200

bus_t4:
  id: bus

cover:
  - platform: bus_t4
    name: "Gate"
    id: gate
    auto_learn_timing: true
    open_duration: 20s
    close_duration: 20s
    position_report_interval: 1s

# Optional: Additional buttons for partial opening
button:
  - platform: template
    name: "Partial Open 1"
    icon: "mdi:gate-arrow-right"
    on_press:
      - lambda: id(gate).send_cmd(CMD_OPEN_PARTIAL_1);

  - platform: template
    name: "Partial Open 2"
    icon: "mdi:gate-arrow-right"
    on_press:
      - lambda: id(gate).send_cmd(CMD_OPEN_PARTIAL_2);

  - platform: template
    name: "Step-by-Step"
    icon: "mdi:gate"
    on_press:
      - lambda: id(gate).send_cmd(CMD_STEP);

# Motor controller configuration switches
# Toggling a switch sends a SET command; the switch also listens to all bus
# traffic and reacts to GET/SET replies, so changes made via Oview or another
# client are reflected immediately. Each function is an independent on/off flag.
# Supported types: auto_close, photo_close, always_close, standby, peak,
# pre_flash, slave.
switch:
  - platform: bus_t4
    type: auto_close
    name: "Auto-Close"
    icon: "mdi:timer"

  - platform: bus_t4
    type: photo_close
    name: "Photo-Close"
    icon: "mdi:camera-timer"

  - platform: bus_t4
    type: always_close
    name: "Always Close"
    icon: "mdi:lock"

  - platform: bus_t4
    type: standby
    name: "Standby Mode"
    icon: "mdi:power-standby"

  - platform: bus_t4
    type: peak
    name: "Peak Mode"
    icon: "mdi:speedometer"

  - platform: bus_t4
    type: pre_flash
    name: "Pre-Flash Warning"
    icon: "mdi:alarm-light"

  - platform: bus_t4
    type: slave
    name: "Slave Mode"
    icon: "mdi:link-variant"

# Security lock using IT4WIFI device identity
lock:
  - platform: template
    name: "Gate Lock"
    optimistic: true
    on_lock:
      - lambda: 'id(gate).send_cmd(CMD_BLOCK, IT4WIFI);'
    on_unlock:
      - lambda: 'id(gate).send_cmd(CMD_RELEASE, IT4WIFI);'

